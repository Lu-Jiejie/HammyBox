name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: 'Worker Name'
        required: false
        default: 'hammybox'
      build_frontend:
        description: '是否构建最新前端（选 no 则复用上次成功构建的 frontend-dist）'
        type: choice
        required: true
        default: 'yes'
        options:
          - 'yes'
          - 'no'

# 所有配置均通过 Secrets 传入（public 仓库的 Variables 对所有人可见，不安全）
#
# 在仓库 Settings → Secrets and variables → Actions → Secrets 中配置：
#
# 必填：
#   CLOUDFLARE_API_TOKEN  - Cloudflare API Token（需要 Workers 编辑权限）
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare Account ID
#
# 数据库（二选一）：
#   D1_DATABASE_ID        - D1 数据库 ID
#   KV_NAMESPACE_ID       - KV 命名空间 ID
#
# 可选：
#   R2_BUCKET_NAME        - R2 存储桶名称
#   WORKER_NAME           - Worker 名称（默认 hammybox，手动触发时可在界面覆盖）
#   WORKER_VARS           - JSON 格式的业务环境变量（非必要不建议配置，
#                           部署完成后请在管理面板中配置所有设置）

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 配置了 Cloudflare secrets 时运行（未配置 secrets 的仓库自动跳过）
    steps:
      - name: Check deployment config
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "CLOUDFLARE_API_TOKEN not configured, skipping Worker deployment"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        # 需要 devDependencies（typescript/tsx）来运行 typecheck 与路由生成
        run: npm ci

      - name: Typecheck
        if: steps.check.outputs.skip != 'true'
        run: npx tsc --noEmit

      # ── 前端构建（可复用的逻辑，yes/no 都经过此步骤）──
      # yes：构建最新前端并上传产物；no：优先下载上次产物，没有则回退构建
      - name: Build frontend (download previous artifact when build_frontend=no)
        if: steps.check.outputs.skip != 'true' && inputs.build_frontend == 'no'
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Build frontend
        if: steps.check.outputs.skip != 'true'
        id: build
        run: |
          # build_frontend=no 时若已下载到产物则跳过构建
          if [ "${{ inputs.build_frontend }}" = "no" ] && [ -f "frontend-dist/index.html" ]; then
            echo "Reusing previous frontend-dist artifact"
            exit 0
          fi

          echo "Building frontend from source..."
          rm -rf frontend-src frontend-dist
          git clone --depth 1 https://github.com/Lu-Jiejie/HammyBox-Frontend.git frontend-src
          cd frontend-src
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          cd ..
          # 前端构建产物目录默认是 dist/，复制为 frontend-dist
          cp -r frontend-src/dist frontend-dist
          echo "Frontend built successfully"

      - name: Upload frontend artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/
          retention-days: 90
          if-no-files-found: error

      - name: Generate worker routes
        if: steps.check.outputs.skip != 'true'
        run: npx tsx deploy/worker/generate-routes.ts

      - name: Generate wrangler config
        if: steps.check.outputs.skip != 'true'
        env:
          WORKER_NAME: ${{ inputs.worker_name || secrets.WORKER_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          WORKER_VARS: ${{ secrets.WORKER_VARS }}
        run: npx tsx deploy/worker/generate-toml.ts

      - name: Deploy to Cloudflare Workers
        if: steps.check.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config deploy/worker/wrangler.toml
